name: xeniumranger_resegment
namespace: xeniumranger
scope: public
description: |
  Generate a new segmentation of the morphology image space by rerunning the Xenium Onboard Analysis (XOA) segmentation algorithms with modified parameters.
keywords: [xeniumranger]
links:
  documentation: https://www.10xgenomics.com/support/software/xenium-ranger/latest/analysis/running-pipelines/XR-resegment
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
- name: Inputs
  arguments:
  - name: "--xenium_bundle"
    type: file
    required: true
    description: |
      File path to directory containing all required Xenium Onboard Analysis output files.
    example: "/path/to/xenium_output_bundle"
  - name: "--id"
    type: string
    required: true
    description: |
      Unique string to specify the name of the relabel output folder. May only include ASCII characters (alphanumeric, underscore, dash, period) and must not use whitespace, slash, quote, or comma characters.
    example: "sample_relabel"
- name: Staining arguments
  arguments:
  - name: "--boundary_stain"
    type: string
    required: false
    description: |
      Specify the name of the boundary stain to use or disable. Supported for cell segmentation staining workflow output bundles.
    choices: ["ATP1A1/CD45/E-Cadherin", "18S", "alphaSMA/Vimentin", "disable"]
    default: "ATP1A1/CD45/E-Cadherin"
  - name: "--interior_stain"
    type: string
    required: false
    description: |
      Specify the name of the interior stain to use or disable.
    choices: ["ATP1A1/CD45/E-Cadherin", "18S", "alphaSMA/Vimentin", "disable"]
    default: "18S"
- name: Image arguments
  arguments:
  - name: "--segment_large_cells"
    type: boolean_true
    description: |
      Run boundary stain-based large cell segmentation.
  - name: "--expansion_distance"
    type: integer
    required: false
    description: |
      Nuclei boundary expansion distance in µm. (Min: 0, Max: 15 if either --boundary_stain
      or --interior_stain are enabled and 100 if nucleus-expansion only).
    default: 0
  - name: "--dapi_filter"
    type: integer
    required: false
    description: |
      Minimum intensity in photoelectrons (pe) to filter nuclei. Specifies the threshold for the 2D
      DAPI image; if the 2D image is deconvolved, XR v4.0 automatically multiplies this by 7 for the
      DAPI Z-stack. If left unset, xeniumranger uses its own default: 15 pe for deconvolved DAPI,
      100 pe for non-deconvolved DAPI.
  - name: "--resegment_nuclei"
    type: boolean_true
    description: |
      Boolean to specify whether to rerun the latest Xenium Onboard Analysis nucleus segmentation algorithm
      or to use existing nucleus segmentation masks in the cells.zarr file. This parameter is deprecated and
      will be removed in a future release.
- name: Outputs
  arguments:
  - name: "--output"
    type: file
    required: true
    direction: output
    description: |
      The folder to store the relabeled Xenium Ranger output bundle.
    example: "/path/to/output"
resources:
  - type: bash_script
    path: script.sh
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium/xenium_tiny
  - path: /resources_test/xenium/xenium_multicellseg_tiny_raw
engines:
  - type: docker
    image: quay.io/nf-core/xeniumranger:4.0
    setup:
      - type: docker
        run: |
          DEBIAN_FRONTEND=noninteractive apt update && \
          apt upgrade -y && apt install -y procps && rm -rf /var/lib/apt/lists/*
    test_setup:
      - type: docker
        run: |
          export DEBIAN_FRONTEND=noninteractive && \
          apt update && \
          apt install -y python3.9 python3.9-venv python3.9-distutils python-is-python3 git curl ca-certificates && \
          curl -sS https://bootstrap.pypa.io/pip/3.9/get-pip.py | python3.9 && \
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 10 && \
          update-alternatives --set python3 /usr/bin/python3.9 && \
          rm -rf /var/lib/apt/lists/*
      - type: python
        packages:
          - pyarrow==21.0.0
          - numpy<2
          - scanpy~=1.9.8
      - type: python
        packages:
          - anndata==0.10.8
          - viashpy==0.9.0
        __merge__: /src/base/requirements/openpipeline_testutils.yaml
      - type: python
        packages:
          - tifffile==2023.7.10
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [highcpu, veryhighmem, highdisk]