name: "subset_xenium"
namespace: "filter"
version: "build_main"
authors:
- name: "Mirte De Temmerman"
  roles:
  - "author"
  info:
    links:
      github: "mimi-DT"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "Input folder. Must contain the raw output from a Xenium run (the\
      \ same\nbundle read by `convert/from_xenium_to_spatialdata`).\n"
    info: null
    example:
    - "xenium_data"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    alternatives:
    - "-o"
    description: "The directory where the cropped Xenium output bundle will be stored."
    info: null
    example:
    - "xenium_data_tiny"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--margin_um"
    description: "Padding, in microns, around the selected patch's cell bounding box."
    info: null
    default:
    - 10.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--eps_um"
    description: "Single-linkage radius, in microns, for patch clustering: cells within\n\
      this distance of each other are considered part of the same patch.\n"
    info: null
    default:
    - 30.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--min_cells_per_patch"
    description: "Minimum number of cells to form a patch. Smaller clusters and isolated\n\
      cells are excluded.\n"
    info: null
    default:
    - 5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--patch_rank"
    description: "Which patch to keep, ranked by cell count descending (0 = largest).\n"
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "setup_logger.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Crops a raw 10x Genomics Xenium output bundle down to one dense patch\
  \ of cells.\n\n**Scope.** For now this component is only used to create the cropped\n\
  `xenium_multicellseg_tiny_cropped` test data from `xenium_multicellseg_tiny`\n(see\
  \ `resources_test_scripts/xenium_multicellseg_tiny.sh`), which is stored\nnext to\
  \ the uncropped bundle and used by e.g. the `cellpose_sam` component.\nIt is not\
  \ a general-purpose subsetting tool: it only works on a *raw* `outs/` \nbundle that\
  \ already consist of separate patches of cells (datasets that are \nalready tiny,\
  \ e.g. 10x's \"tiny\" examples). Cell centroids are clustered by \ndistance (`--eps_um`),\
  \ one patch is picked by cell count (`--patch_rank`), and \nits bounding box plus\
  \ a margin (`--margin_um`) is the crop window. On a contiguous\ntissue section the\
  \ cells typically form a single cluster, so nothing is cropped.\n"
test_resources:
- type: "python_script"
  path: "test.py"
  is_executable: true
- type: "file"
  path: "xenium_multicellseg_tiny"
info: null
status: "enabled"
scope:
  image: "private"
  target: "private"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_spatial"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "lowmem"
    - "singlecpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "python:3.12-slim"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "procps"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "pandas~=2.2.3"
    - "numpy~=2.1.3"
    - "pyarrow~=18.0.0"
    - "scipy~=1.17.1"
    - "h5py~=3.12.1"
    - "tifffile~=2024.12.12"
    - "imagecodecs~=2024.12.30"
    - "zarr~=3.0.6"
    upgrade: true
  test_setup:
  - type: "apt"
    packages:
    - "git"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "viashpy==0.10.0"
    github:
    - "openpipelines-bio/core#subdirectory=packages/python/openpipeline_testutils"
    upgrade: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/filter/subset_xenium/config.vsh.yaml"
  runner: "executable"
  engine: "docker"
  output: "target/_private/executable/filter/subset_xenium"
  executable: "target/_private/executable/filter/subset_xenium/subset_xenium"
  viash_version: "0.9.7"
  git_commit: "203d556ac2ed5fecd06bb27ea0c992f9981e48ca"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_spatial"
package_config:
  name: "openpipeline_spatial"
  version: "build_main"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_spatial/resources_test"
      dest: "resources_test"
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  organization: "openpipelines-bio"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline_spatial"
    docker_registry: "ghcr.io"
