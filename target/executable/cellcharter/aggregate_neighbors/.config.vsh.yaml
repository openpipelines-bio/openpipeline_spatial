name: "aggregate_neighbors"
namespace: "cellcharter"
version: "build_main"
authors:
- name: "Mirte De Temmerman"
  roles:
  - "author"
  info:
    links:
      github: "mimi-DT"
      linkedin: "mirtedt"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--input"
    description: "Input H5MU file containing a spatial neighborhood graph."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality from the input MuData file to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_obsm_features"
    description: "Key in `.obsm` containing the features to aggregate, typically a\
      \ dimensionality-reduced\nrepresentation. This is the recommended input, since\
      \ the size of\nthe output scales with the number of input features. CellCharter\
      \ recommends a batch-corrected\nlatent space, such as an scVI embedding (e.g.\
      \ `X_scvi_integrated`) for transcriptomics data,\nespecially when multiple samples\
      \ are analyzed. `X_pca` is a suitable alternative for a single\nsample or data\
      \ with negligible batch effects.\nIgnored when `--layer` or `--use_x` is set.\
      \ If none of these is set, `.X` is used.\n"
    info: null
    example:
    - "X_scvi_integrated"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--layer"
    description: "Layer containing the features to aggregate, instead of `--input_obsm_features`.\n\
      Mutually exclusive with `--use_x`.\nNote that sparse features are converted\
      \ to a dense matrix, and the aggregated output is dense\nas well, which can\
      \ require a large amount of memory for many features.\n"
    info: null
    example:
    - "log_normalized"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--use_x"
    description: "Aggregate the features in `.X`, instead of `--input_obsm_features`.\n\
      Mutually exclusive with `--layer`.\nNote that sparse features are converted\
      \ to a dense matrix, and the aggregated output is dense\nas well, which can\
      \ require a large amount of memory for many features.\n"
    info: null
    direction: "input"
  - type: "string"
    name: "--input_obsp_spatial_connectivities"
    description: "Key in `.obsp` where the connectivities of the spatial neighborhood\
      \ graph are stored."
    info: null
    default:
    - "spatial_connectivities"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_obs_sample_key"
    description: "Key in `.obs` that identifies the sample each observation belongs\
      \ to.\nWhen set, neighbors are aggregated separately per sample, so no features\
      \ are aggregated across samples.\nMust be set when the input contains multiple\
      \ samples whose spatial graphs are not disconnected.\n"
    info: null
    example:
    - "sample_id"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Neighborhood aggregation"
  arguments:
  - type: "integer"
    name: "--n_layers"
    description: "Which neighborhood layers (hops) to aggregate.\nIf a single value\
      \ `n` is provided, the output contains the cells' own features and the aggregated\n\
      features of the neighbors up to `n` hops away: `cell | 1-hop | ... | n-hop`.\n\
      If multiple values are provided, each value is a hop distance at which the neighbors'\
      \ features are\naggregated and concatenated. In this case `0` (the cells' own\
      \ features) must be included,\ne.g. `0;1;3` results in `cell | 1-hop | 3-hop`.\n"
    info: null
    default:
    - 3
    required: false
    min: 0
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--aggregations"
    description: "Which functions to use to aggregate the neighbors' features.\nWhen\
      \ multiple are provided, the aggregated features of every function are concatenated\
      \ for every layer.\n"
    info: null
    default:
    - "mean"
    required: false
    choices:
    - "mean"
    - "var"
    direction: "input"
    multiple: true
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    description: "Output H5MU file."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_obsm_aggregated"
    description: "Key in `.obsm` where the aggregated neighborhood features will be\
      \ stored."
    info: null
    default:
    - "X_cellcharter"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata objects.\n\
      By default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "setup_logger.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Aggregates the features of each cell's spatial neighborhood using CellCharter.\n\
  \nFor every cell, the features of the neighbors at increasing distances (hops) in\
  \ the spatial\nneighborhood graph are aggregated (e.g. averaged) and concatenated\
  \ with the cell's own features\ninto a single vector. The resulting matrix can be\
  \ used as input for clustering into spatial domains\n(e.g. with `cellcharter/cluster`).\n\
  \nWraps [`cellcharter.gr.aggregate_neighbors`](https://cellcharter.readthedocs.io/en/latest/generated/cellcharter.gr.aggregate_neighbors.html).\n\
  Requires a spatial neighborhood graph in `.obsp`.\n"
test_resources:
- type: "python_script"
  path: "test.py"
  is_executable: true
- type: "file"
  path: "xenium_tiny.qc.all_neighbors.pca.h5mu"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
license: "BSD-3-Clause"
references:
  doi:
  - "10.1038/s41588-023-01588-4"
links:
  repository: "https://github.com/CSOgroup/cellcharter"
  docker_registry: "ghcr.io"
  homepage: "https://github.com/CSOgroup/cellcharter"
  documentation: "https://cellcharter.readthedocs.io/en/latest/generated/cellcharter.gr.aggregate_neighbors.html"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
