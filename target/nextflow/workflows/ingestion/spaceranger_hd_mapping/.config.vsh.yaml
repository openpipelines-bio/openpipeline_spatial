name: "spaceranger_hd_mapping"
namespace: "workflows/ingestion"
version: "build_main"
authors:
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    role: "Contributor"
    links:
      email: "jakub@data-intuitive.com"
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
    organizations:
    - name: "Data Intuitive"
      href: "https://www.data-intuitive.com"
      role: "Bioinformatics Engineer"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "string"
    name: "--id"
    description: "ID of the sample."
    info: null
    example:
    - "foo"
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input"
    description: "The fastq.gz files to align with Space Ranger. Can also be a single\n\
      directory containing fastq.gz files.\n\nIndividual FASTQ files should follow\
      \ the naming convention of 10x Genomics:\n[Sample Name]_S[Sample Number]_L[Lane\
      \ Number]_[Read Type]_001.fastq.gz\n"
    info: null
    example:
    - "sample_S1_L001_R1_001.fastq.gz"
    - "sample_S1_L001_R2_001.fastq.gz"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "file"
    name: "--gex_reference"
    description: "Path of folder containing 10x-compatible reference."
    info: null
    example:
    - "/path/to/refdata-gex-GRCh38-2020-A"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--probe_set"
    description: "CSV file specifying the probe set used. Omit for Visium HD 3' data\n\
      (sequencing-based); provide it only for probe-based Visium HD.\n"
    info: null
    example:
    - "Visium_Mouse_Transcriptome_Probe_Set_v2.0_mm10-2020-A.csv"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--cytaimage"
    description: "Brightfield image generated by the CytAssist instrument. Required\
      \ for\nVisium HD.\n"
    info: null
    example:
    - "cytassist.tiff"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--image"
    description: "H&E microscope image (TIFF or JPG). Required to run nucleus/cell\n\
      segmentation.\n"
    info: null
    example:
    - "brightfield.tif"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output_raw"
    description: "Location where the raw Space Ranger output folder will be stored."
    info: null
    example:
    - "output_dir"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_spatialdata"
    description: "The Space Ranger output, converted to SpatialData (Zarr)."
    info: null
    example:
    - "output.zarr"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--mode"
    description: "Which Space Ranger HD output to convert to SpatialData: `segmented_cells`\n\
      (per-cell counts and cell boundary polygons) or `bins` (binned counts at\n`--bin_size`).\
      \ Segmentation is generally preferred, but binned output is\navailable for compatibility.\n"
    info: null
    default:
    - "segmented_cells"
    required: false
    choices:
    - "segmented_cells"
    - "bins"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--bin_size"
    description: "Bin size in microns to convert when `--mode bins`."
    info: null
    default:
    - 8
    required: false
    choices:
    - 2
    - 8
    - 16
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_type"
    description: "Which count matrix to convert (`filtered` or `raw`). Applies to\
      \ both modes."
    info: null
    default:
    - "filtered"
    required: false
    choices:
    - "filtered"
    - "raw"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_layer"
    description: "If provided, store the counts as a named layer in addition to `.X`."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--dataset_id"
    description: "Identifier used to name the spatial elements. Defaults to the sample\
      \ id.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Slide Information"
  arguments:
  - type: "string"
    name: "--slide"
    description: "Visium slide serial number. Optional if present in the CytAssist\
      \ image metadata."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--area"
    description: "Visium capture area identifier. Optional if present in the CytAssist\
      \ image metadata."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--unknown_slide"
    description: "Use if the slide serial number and area are unknown."
    info: null
    required: false
    choices:
    - "visium-1"
    - "visium-2"
    - "visium-2-large"
    - "visium-hd"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--slidefile"
    description: "Slide design file for offline use"
    info: null
    example:
    - "slide_design.gpr"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--override_id"
    description: "Overrides the slide serial number and capture area provided in the\
      \ Cytassist image metadata"
    info: null
    direction: "input"
- name: "Image Options"
  arguments:
  - type: "file"
    name: "--darkimage"
    description: "Multi-channel, dark-background fluorescence image"
    info: null
    example:
    - "fluorescence.tif"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--colorizedimage"
    description: "Color image representing pre-colored dark-background fluorescence\
      \ images"
    info: null
    example:
    - "colored_fluorescence.tif"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--dapi_index"
    description: "Index of DAPI channel (1-indexed) of fluorescence image"
    info: null
    example:
    - 1
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--image_scale"
    description: "Microns per microscope image pixel"
    info: null
    example:
    - 0.65
    required: false
    min: 0.01
    max: 10.0
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--reorient_images"
    description: "Whether to rotate and mirror image to align fiducial pattern"
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--loupe_alignment"
    description: "Alignment file produced by the Loupe Browser manual alignment step.\n\
      Overrides automatic fiducial and tissue detection. The image used to\ngenerate\
      \ this file must match --image or --cytaimage.\n"
    info: null
    example:
    - "alignment.json"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "SpaceRanger arguments"
  arguments:
  - type: "boolean"
    name: "--create_bam"
    description: "Enable or disable BAM file generation."
    info: null
    default:
    - false
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--nosecondary"
    description: "Disable secondary analysis (e.g. clustering)."
    info: null
    direction: "input"
  - type: "integer"
    name: "--r1_length"
    description: "Hard trim the input Read 1 to this length before analysis"
    info: null
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--r2_length"
    description: "Hard trim the input Read 2 to this length before analysis"
    info: null
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--filter_probes"
    description: "Whether to filter the probe set using the \"included\" column"
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--custom_bin_size"
    description: "Bin Visium HD data to an additional custom size in microns (4-100,\
      \ even)."
    info: null
    required: false
    min: 4
    max: 100
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--include_introns"
    description: "Include intronic reads in the count. When unset, Space Ranger applies\
      \ its own default\n(true for Visium HD 3' and Visium v1, false otherwise).\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--nucleus_segmentation"
    description: "Enable or disable nucleus/cell segmentation (on by default when\
      \ an H&E image is given)."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--cell_annotation_model"
    description: "Cloud-based cell type annotation model to use, which requires\n\
      `--tenx_cloud_token_path`. When left out, Space Ranger still annotates\nhuman\
      \ samples with the bundled Pan-Human Azimuth model, which runs\nlocally and\
      \ needs no token.\n"
    info: null
    required: false
    choices:
    - "auto"
    - "human_pca_v1_beta"
    - "mouse_pca_v1_beta"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--tenx_cloud_token_path"
    description: "Path to a 10x Cloud token JSON, required for cloud-based annotation\
      \ models."
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--disable_cell_annotation"
    description: "Disable cell type annotation."
    info: null
    direction: "input"
- name: "Segmentation Options"
  arguments:
  - type: "file"
    name: "--custom_segmentation_file"
    description: "Custom nucleus segmentation mask to use instead of the built-in\
      \ algorithm.\nRequires --nucleus_expansion_distance_micron.\n"
    info: null
    example:
    - "nucleus_segmentation.geojson"
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--nucleus_expansion_distance_micron"
    description: "Distance in microns to expand each nucleus to approximate the cell\
      \ boundary."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--max_nucleus_diameter_px"
    description: "Maximum nucleus diameter in pixels, for samples with exceptionally\
      \ large cells."
    info: null
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--umi_registration"
    description: "Enable or disable UMI-based registration that aligns the microscope\
      \ image to the UMI\ncount data for Visium HD. When unset, Space Ranger applies\
      \ its default.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--umi_to_image_offset"
    description: "Supply a custom offset (as accepted by Space Ranger) to override\
      \ UMI-to-image\nregistration when automatic convergence is incorrect.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
- type: "file"
  path: "utils"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Take raw Visium HD FASTQ files and produce a SpatialData object with\
  \ the\nsegmented cells. Runs Space Ranger 4.1.0 to align reads and perform\nnucleus/cell\
  \ segmentation, then converts the segmented output to SpatialData.\n\nSegmentation\
  \ runs by default when an H&E microscope image (`--image`) is\nprovided. Provide\
  \ `--probe_set` for probe-based Visium HD assays.\n"
test_resources:
- type: "nextflow_script"
  path: "test.nf"
  is_executable: true
  entrypoint: "test_wf"
- type: "file"
  path: "visium_hd_ffpe"
info:
  name: "SpaceRanger HD mapping"
  test_dependencies:
  - name: "spaceranger_hd_mapping_test"
    namespace: "test_workflows/ingestion"
status: "enabled"
scope:
  image: "public"
  target: "public"
dependencies:
- name: "mapping/spaceranger_count"
  repository:
    type: "local"
- name: "convert/from_spaceranger_hd_to_spatialdata"
  repository:
    type: "local"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_spatial"
  docker_registry: "ghcr.io"
runners:
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
build_info:
  config: "src/workflows/ingestion/spaceranger_hd_mapping/config.vsh.yaml"
  runner: "nextflow"
  engine: "native"
  output: "target/nextflow/workflows/ingestion/spaceranger_hd_mapping"
  executable: "target/nextflow/workflows/ingestion/spaceranger_hd_mapping/main.nf"
  viash_version: "0.9.7"
  git_commit: "1438b0e06554efd934b16890bd50f56018614f5f"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_spatial"
  dependencies:
  - "target/nextflow/mapping/spaceranger_count"
  - "target/nextflow/convert/from_spaceranger_hd_to_spatialdata"
package_config:
  name: "openpipeline_spatial"
  version: "build_main"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_spatial/resources_test"
      dest: "resources_test"
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  organization: "openpipelines-bio"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline_spatial"
    docker_registry: "ghcr.io"
