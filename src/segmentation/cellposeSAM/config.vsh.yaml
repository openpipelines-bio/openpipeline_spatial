name: cellposeSAM
namespace: segmentation
description: |
  Segment cells or nuclei from a spatial image using Cellpose-SAM.

  Reads an image element from a SpatialData Zarr store and runs Cellpose-SAM
  (Cellpose's SAM-based generalist segmentation model, the successor to
  Cellpose3) on it, producing an instance segmentation mask. The resulting
  mask is written back into the SpatialData object as a new labels element,
  aligned to the input image's coordinate transformations.

  Unlike Cellpose3, Cellpose-SAM is a single generalist model: it does not
  need a cytoplasm/nuclear channel split (`channels`/`model_type` are gone)
  and works directly on images with an arbitrary number of channels, using
  at most the first three unless a specific subset is selected with
  `--channels`.

authors:
  - __merge__: /src/authors/mirte_detemmerman.yaml
    roles: [ author ]

argument_groups:
  - name: "Inputs"
    arguments:
      - name: "--input"
        type: file
        required: true
        description: Input SpatialData Zarr store containing the image to segment.
        example: input.zarr
      - name: "--input_image"
        type: string
        default: "morphology_focus"
        description: |
          Key in `sdata.images` of the image element to segment.
      - name: "--channels"
        type: integer
        multiple: true
        required: false
        description: |
          Indices (within the image's channel axis), in the desired order,
          of the channels to feed to the model, e.g. `--channels 0 --channels
          2` to use channels 0 and 2 (in that order). At most three channels
          can be used; if not provided, all channels are used as-is, and if
          more than three are present only the first three are used (with a
          warning), matching Cellpose-SAM's own default behavior. Ignored for
          single-channel images.

  - name: "Parameters"
    arguments:
      - name: "--pretrained_model_name"
        type: string
        default: "cpsam_v2"
        choices: ["cpsam_v2", "cpsam"]
        description: |
          Built-in Cellpose-SAM model to use. `cpsam_v2` is the current
          default generalist model; `cpsam` is the original Cellpose-SAM
          release. Ignored if `--pretrained_model_file` is set.
      - name: "--pretrained_model_file"
        type: file
        required: false
        description: |
          Path to a custom pretrained Cellpose-SAM model. If provided, this
          is used instead of `--pretrained_model_name`.
      - name: "--diameter"
        type: double
        required: false
        min: 0.0
        description: |
          Expected diameter of objects in pixels; the image is rescaled so
          that objects are approximately 30 pixels wide before segmentation.
          Unlike Cellpose3, Cellpose-SAM does not automatically estimate the
          diameter when this is left unset (no rescaling is applied, i.e. a
          rescale factor of 1.0); the model was trained to be relatively
          size-invariant, so leaving this unset is a reasonable default.
      - name: "--flow_threshold"
        type: double
        default: 0.4
        description: |
          Maximum allowed error of the flows for each mask. Increase this
          threshold if Cellpose is not returning enough masks; decrease it if
          Cellpose is returning too many ill-shaped masks.
      - name: "--cellprob_threshold"
        type: double
        default: 0.0
        min: -6.0
        max: 6.0
        description: |
          Pixels with cell probability above this threshold are used to run
          dynamics and determine masks. Decrease this threshold if Cellpose is
          not returning as many masks as expected.
      - name: "--min_size"
        type: integer
        default: 15
        min: 1
        description: Minimum number of pixels per mask; masks smaller than this are discarded.
      - name: "--max_size_fraction"
        type: double
        default: 0.4
        min: 0.0
        max: 1.0
        description: |
          Masks larger than this fraction of the total image size are
          discarded.
      - name: "--niter"
        type: integer
        required: false
        min: 0
        description: |
          Number of iterations of the dynamics simulation used to derive
          masks. If not provided, this is determined automatically based on
          the object diameter.
      - name: "--resample"
        type: boolean
        default: true
        description: |
          Whether to run dynamics on the full-resolution image rather than on
          the (typically smaller) resized image used internally by the model.
      - name: "--augment"
        type: boolean
        default: false
        description: Whether to tile the image with overlapping tiles and average the predictions.
      - name: "--batch_size"
        type: integer
        default: 8
        min: 1
        description: Number of 256x256 image tiles to run simultaneously on the GPU or CPU.
      - name: "--use_gpu"
        type: boolean
        default: false
        description: Whether to run the model on a GPU, if one is available.
      - name: "--normalize_percentile_low"
        type: double
        default: 1.0
        min: 0.0
        max: 100.0
        description: |
          Lower percentile used to rescale pixel intensities before running
          the model.
      - name: "--normalize_percentile_high"
        type: double
        default: 99.9
        min: 0.0
        max: 100.0
        description: |
          Upper percentile used to rescale pixel intensities before running
          the model. Fluorescence images such as spatial transcriptomics DAPI
          scans are mostly background, so Cellpose's own default of 99 can
          land on a still-zero pixel and degenerate the normalization; 99.9
          is a safer default for this kind of sparse image.

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        direction: output
        required: true
        description: Output SpatialData Zarr store.
        example: output.zarr
      - name: "--output_labels"
        type: string
        default: "cellposeSAM_labels"
        description: |
          Key under which to store the resulting segmentation mask in
          `sdata.labels`.

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium/xenium_tiny.zarr

engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        __merge__: [ /src/base/requirements/cellpose_sam.yaml, . ]
    __merge__: [ /src/base/requirements/python_test_setup.yaml, .]

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midcpu, highmem, highdisk]
