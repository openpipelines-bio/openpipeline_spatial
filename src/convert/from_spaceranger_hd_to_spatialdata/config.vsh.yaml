name: "from_spaceranger_hd_to_spatialdata"
namespace: "convert"
scope: "public"
description: |
  Converts the cell-segmentation output from 10X Genomics Space Ranger for
  Visium HD into a SpatialData object.

  Space Ranger 4.x runs nucleus and cell segmentation for Visium HD / HD 3'
  samples and writes the results to a `segmented_outputs/` directory. This
  component reads the segmented cells (per-cell count matrix and cell boundary
  polygons) and stores them in a SpatialData Zarr store. The cell table is
  renamed to "table" so that downstream components stay technology-agnostic.
keywords: [spaceranger, visium_hd, segmentation, spatialdata]
links:
  documentation: https://www.10xgenomics.com/support/software/space-ranger/latest/analysis/outputs/segmented-outputs
authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]
arguments:
  - name: "--input"
    alternatives: ["-i"]
    type: file
    description: |
      Input folder. Must contain the output from a Space Ranger run for Visium
      HD with cell segmentation, including the `segmented_outputs/` directory
      and a `*_feature_slice.h5` file.
    example: spaceranger_output
    direction: input
    required: true
  - name: "--output"
    alternatives: ["-o"]
    type: file
    description: Zarr directory where the SpatialData object will be stored.
    example: "visium_hd_data.zarr"
    direction: output
    required: true
  - name: "--output_type"
    type: string
    description: |
      Which segmented cell count matrix to load: `filtered` (cells under tissue
      only) or `raw` (all cells).
    choices: [ filtered, raw ]
    default: filtered
  - name: "--output_layer"
    type: string
    description: |
      If provided, the count matrix is also stored as a named layer
      (`table.layers[output_layer]`) in addition to `.X`.
    required: false
  - name: "--dataset_id"
    type: string
    description: |
      Identifier used to name the spatial elements (shapes and images) in the
      SpatialData object. If not provided, it is inferred from the
      `*_feature_slice.h5` file name in the input directory.
    required: false
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/visium_hd
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        __merge__: [ /src/base/requirements/spatialdata-io.yaml, . ]
    __merge__: [ /src/base/requirements/python_test_setup.yaml, . ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ midmem, singlecpu ]
