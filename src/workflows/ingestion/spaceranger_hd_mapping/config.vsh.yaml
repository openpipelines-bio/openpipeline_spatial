name: "spaceranger_hd_mapping"
namespace: "workflows/ingestion"
scope: "public"
description: |
  Take raw Visium HD FASTQ files and produce a SpatialData object with the
  segmented cells. Runs Space Ranger 4.1.0 to align reads and perform
  nucleus/cell segmentation, then converts the segmented output to SpatialData.

  Segmentation runs by default when an H&E microscope image (`--image`) is
  provided. Provide `--probe_set` for probe-based Visium HD assays.
info:
  name: SpaceRanger HD mapping
authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--id"
        required: true
        type: string
        description: ID of the sample.
        example: foo
      - name: --input
        type: file
        required: true
        multiple: true
        description: |
          The fastq.gz files to align with Space Ranger. Can also be a single
          directory containing fastq.gz files.

          Individual FASTQ files should follow the naming convention of 10x Genomics:
          [Sample Name]_S[Sample Number]_L[Lane Number]_[Read Type]_001.fastq.gz
        example: [ "sample_S1_L001_R1_001.fastq.gz", "sample_S1_L001_R2_001.fastq.gz" ]
      - name: --gex_reference
        type: file
        required: true
        description: Path of folder containing 10x-compatible reference.
        example: "/path/to/refdata-gex-GRCh38-2020-A"
      - name: --probe_set
        type: file
        required: false
        description: |
          CSV file specifying the probe set used. Omit for Visium HD 3' data
          (sequencing-based); provide it only for probe-based Visium HD.
        example: "Visium_Mouse_Transcriptome_Probe_Set_v2.0_mm10-2020-A.csv"
      - name: --cytaimage
        type: file
        required: true
        description: |
          Brightfield image generated by the CytAssist instrument. Required for
          Visium HD.
        example: "cytassist.tiff"
      - name: --image
        type: file
        required: false
        description: |
          H&E microscope image (TIFF or JPG). Required to run nucleus/cell
          segmentation.
        example: "brightfield.tif"

  - name: Outputs
    arguments:
      - name: "--output_raw"
        type: file
        direction: output
        description: Location where the raw Space Ranger output folder will be stored.
        required: true
        example: output_dir/
      - name: "--output_spatialdata"
        type: file
        direction: output
        description: The Space Ranger output, converted to SpatialData (Zarr).
        required: true
        example: output.zarr
      - name: "--mode"
        type: string
        description: |
          Which Space Ranger HD output to convert to SpatialData: `segmented_cells`
          (per-cell counts and cell boundary polygons) or `bins` (binned counts at
          `--bin_size`). Segmentation is generally preferred, but binned output is
          available for compatibility.
        choices: [ segmented_cells, bins ]
        default: segmented_cells
      - name: "--bin_size"
        type: integer
        description: Bin size in microns to convert when `--mode bins`.
        choices: [ 2, 8, 16 ]
        default: 8
      - name: "--output_type"
        type: string
        description: Which count matrix to convert (`filtered` or `raw`). Applies to both modes.
        choices: [ filtered, raw ]
        default: filtered
      - name: "--output_layer"
        type: string
        description: If provided, store the counts as a named layer in addition to `.X`.
        required: false
      - name: "--dataset_id"
        type: string
        description: |
          Identifier used to name the spatial elements. Defaults to the sample id.
        required: false

  - name: Slide Information
    arguments:
      - name: --slide
        type: string
        description: Visium slide serial number. Optional if present in the CytAssist image metadata.
        required: false
      - name: --area
        type: string
        description: Visium capture area identifier. Optional if present in the CytAssist image metadata.
        required: false
      - name: --unknown_slide
        type: string
        description: Use if the slide serial number and area are unknown.
        required: false
        choices: [visium-1, visium-2, visium-2-large, visium-hd]

  - name: SpaceRanger arguments
    arguments:
      - name: --create_bam
        type: boolean
        required: false
        default: false
        description: Enable or disable BAM file generation.
      - name: --nosecondary
        type: boolean_true
        description: Disable secondary analysis (e.g. clustering).
      - name: --custom_bin_size
        type: integer
        description: Bin Visium HD data to an additional custom size in microns (4-100, even).
        min: 4
        max: 100
      - name: --nucleus_segmentation
        type: boolean
        required: false
        description: Enable or disable nucleus/cell segmentation (on by default when an H&E image is given).
      - name: --cell_annotation_model
        type: string
        required: false
        description: |
          Cell type annotation model to use. The Pan-Human Azimuth model
          (`human_pca_v1_beta`) runs locally without a 10x Cloud token for human
          samples.
        choices: [auto, human_pca_v1_beta, mouse_pca_v1_beta]
      - name: --tenx_cloud_token_path
        type: file
        required: false
        description: Path to a 10x Cloud token JSON, required for cloud-based annotation models.
      - name: --disable_cell_annotation
        type: boolean_true
        description: Disable cell type annotation.

dependencies:
  - name: mapping/spaceranger_count
  - name: convert/from_spaceranger_hd_to_spatialdata

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /src/workflows/utils/
test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/visium_hd_ffpe
runners:
  - type: nextflow
