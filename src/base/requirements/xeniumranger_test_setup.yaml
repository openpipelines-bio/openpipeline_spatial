test_setup:
  - type: docker
    run: |
      export DEBIAN_FRONTEND=noninteractive && \
      apt update && \
      apt install -y python3.9 python3.9-venv python3.9-distutils python-is-python3 git curl ca-certificates && \
      curl -sS https://bootstrap.pypa.io/pip/3.9/get-pip.py | python3.9 && \
      update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 10 && \
      update-alternatives --set python3 /usr/bin/python3.9 && \
      rm -rf /var/lib/apt/lists/*
  - type: python
    packages:
      - pyarrow==21.0.0
      - numpy<2
      - scanpy~=1.9.8
  - type: python
    packages:
      - anndata==0.10.8
      - viashpy==0.9.0
    # Pinned: later openpipeline_testutils versions require python>=3.12,
    # while this test image runs python 3.9.
    github:
      - openpipelines-bio/core@d1be1ae27029727da5a26391e327c4db472f727b#subdirectory=packages/python/openpipeline_testutils
 
