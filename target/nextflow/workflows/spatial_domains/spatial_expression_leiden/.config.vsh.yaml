name: "spatial_expression_leiden"
namespace: "workflows/spatial_domains"
version: "build_main"
authors:
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    links:
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "string"
    name: "--id"
    description: "ID of the sample."
    info: null
    example:
    - "foo"
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "Path to the sample."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_obsm_spatial_coords"
    description: "Key in `adata.obsm` where spatial coordinates are stored."
    info: null
    default:
    - "spatial"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_obs_library_key"
    description: "Key in `adata.obs` that identifies the library (e.g. sample) each\
      \ observation belongs to.\nThe spatial neighborhood graph is computed separately\
      \ for each library, so no spatial\nedges are created between observations of\
      \ different libraries.\n"
    info: null
    default:
    - "sample_id"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Spatial Neighbor Graph"
  description: "Options for the calculation of the spatial neighborhood graph.\n"
  arguments:
  - type: "string"
    name: "--coord_type"
    description: "Type of coordinate system. Valid options are:\n`grid` - grid coordinates.\
      \ Only relevant for lattice-based layouts (e.g. Visium). Builds a graph assuming\
      \ a regular grid topology, where neighbors are defined by grid adjacency rather\
      \ than distance.\n`generic` - Generic coordinates. Recommended for imaging-based\
      \ data. This option is appropriate for irregularly spaced points, such as cell\
      \ centroids or spot coordinates from imaging-based assays (e.g. Xenium, CosMx).\
      \ Setting this option avoids grid-assumption artifacts and ensures each node\
      \ has spatial neighbors as defined by distance.\n"
    info: null
    default:
    - "generic"
    required: false
    choices:
    - "generic"
    - "grid"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_spatial_neighbors"
    description: "Depending on `--coord_type`:\n`grid` - number of neighboring tiles.\n\
      `generic` - number of neighborhoods for non-grid data. Only used when `--delaunay\
      \ False`.\n"
    info: null
    default:
    - 6
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--delaunay"
    description: "Whether to use Delaunay triangulation to determine spatial neighborhood\
      \ graph.\nOnly used when `--coord_type generic`.\n"
    info: null
    default:
    - false
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Graph Fusion"
  description: "Options for fusing the expression and spatial neighborhood graphs\
    \ into a single graph.\nThe fusion is a linear combination of the expression connectivities\
    \ and spatial\nconnectivities matrices, weighted by `--alpha`.\n"
  arguments:
  - type: "double"
    name: "--alpha"
    description: "Weight of the spatial graph in the graph fusion.\nA value of 0 results\
      \ in the expression graph only;\na value of 1 results in the spatial graph only.\n"
    info: null
    default:
    - 0.5
    required: false
    min: 0.0
    max: 1.0
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Leiden Clustering"
  description: "Options for Leiden clustering on the fused graph.\n"
  arguments:
  - type: "double"
    name: "--resolution"
    description: "Control the coarseness of the clustering. Higher values lead to\
      \ more clusters.\nMultiple values will result in clustering being performed\
      \ multiple times, with\none resulting `.obs` column per resolution (see `--obs_cluster`).\n"
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "integer"
    name: "--leiden_n_iterations"
    description: "How many iterations of the Leiden clustering algorithm to perform.\n\
      When not set, the algorithm will run until it reaches its optimal clustering.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--leiden_seed"
    description: "Fix the initialization of the optimization. Can be used to increase\
      \ reproducibility.\n"
    info: null
    required: false
    min: 0
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obs_cluster"
    description: "Prefix for the `.obs` keys under which to store the spatial domain\
      \ labels. Newly created\ncolumns in `.obs` will be named after the value of\
      \ `--obs_cluster`, suffixed with an\nunderscore and one of the resolutions specified\
      \ in `--resolution`.\n"
    info: null
    default:
    - "leiden_domains"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    description: "Destination path to the output."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata objects.\n\
      By default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "A pipeline to identify spatial domains by fusing an expression k-NN\
  \ graph\nwith a spatial neighborhood graph and performing Leiden clustering on the\n\
  fused graph, producing per-resolution domain labels in `.obs`.\n\nRequired input:\n\
  \  .obsp['connectivities']             -  A pre-computed expression k-NN graph (e.g.\
  \ from process_samples).\n  .obsm[--input_obsm_spatial_coords]  -  Spatial coordinates\
  \ of the observations.\n  .obs[--input_obs_library_key]       -  The library (e.g.\
  \ sample) each observation belongs to.\n"
test_resources:
- type: "nextflow_script"
  path: "test.nf"
  is_executable: true
  entrypoint: "test_wf"
- type: "file"
  path: "xenium_tiny.qc.all_neighbors.pca.h5mu"
- type: "file"
  path: "Lung5_tiny_processed.h5mu"
- type: "file"
  path: "visium_tiny_processed.h5mu"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
dependencies:
- name: "neighbors/spatial_neighborhood_graph"
  repository:
    type: "local"
- name: "neighbors/join_graphs"
  repository:
    type: "local"
- name: "cluster/leiden"
  repository:
    type: "vsh"
    repo: "openpipeline"
    tag: "v4.1.0"
- name: "metadata/move_obsm_to_obs"
  repository:
    type: "vsh"
    repo: "openpipeline"
    tag: "v4.1.0"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
