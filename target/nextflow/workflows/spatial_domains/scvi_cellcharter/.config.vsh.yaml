    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
build_info:
  config: "src/workflows/spatial_domains/scvi_cellcharter/config.vsh.yaml"
  runner: "nextflow"
  engine: "native"
  output: "target/nextflow/workflows/spatial_domains/scvi_cellcharter"
  executable: "target/nextflow/workflows/spatial_domains/scvi_cellcharter/main.nf"
  viash_version: "0.9.7"
  git_commit: "7311fe9950e4d56853ebbee6e3ee5caf4945bf7c"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_spatial"
  dependencies:
  - "target/dependencies/vsh/vsh/openpipeline/v4.1.0/nextflow/integrate/scvi"
  - "target/nextflow/neighbors/spatial_neighborhood_graph"
  - "target/nextflow/cellcharter/aggregate_neighbors"
  - "target/nextflow/cellcharter/cluster"
package_config:
