name: "subset_xenium"
scope: "private"
namespace: "filter"
description: |
  Crops a raw 10x Genomics Xenium output bundle down to one dense patch of cells.

  **Scope.** For now this component is only used to create the cropped
  `xenium_multicellseg_tiny_cropped` test data from `xenium_multicellseg_tiny`
  (see `resources_test_scripts/xenium_multicellseg_tiny.sh`), which is stored
  next to the uncropped bundle and used by e.g. the `cellpose_sam` component.
  It is not a general-purpose subsetting tool: it only works on bundles that
  already consist of separate patches of cells (datasets that are already tiny,
  e.g. 10x's "tiny" examples). Cell centroids are clustered by distance
  (`--eps_um`), one patch is picked by cell count (`--patch_rank`), and its
  bounding box plus a margin (`--margin_um`) is the crop window. On a contiguous
  tissue section the cells typically form a single cluster, so nothing is cropped.

  It operates on the *raw* `outs/` bundle (the format read by
  `convert/from_xenium_to_spatialdata`) and writes a smaller bundle in the same
  format, with micron coordinates rebased to start at (0, 0) and zarr stores in
  zarr v2 (the only version Xenium Ranger reads). Cropped consistently:

    - `cells.zarr.zip`: cell and nucleus label masks (renumbered to 1..N),
      cell table and polygon sets. Only cells lying entirely inside the window,
      with all their nuclei, are kept; this "kept cells" set defines all other
      files.
    - `cells.parquet`, `cell_boundaries.parquet`, `nucleus_boundaries.parquet`,
      `cell_feature_matrix.h5`, `cell_feature_matrix.zarr.zip`,
      `analysis.zarr.zip`, `*.csv.gz`: subset to the kept cells.
    - `transcripts.parquet`: filtered to the window; transcripts of dropped
      cells become `UNASSIGNED`.
    - `transcripts.zarr.zip`: transcript tiles and density grids rebuilt from the
      kept transcripts; the coarser (clustered) tile levels are approximated and
      `metrics_density` is only sliced to the bins overlapping the crop.
    - `morphology_focus/*.ome.tif`, `morphology.ome.tif`: all planes cropped,
      OME-XML reused with only `SizeX`/`SizeY` patched.

  Not updated: `experiment.xenium` (only `num_cells` is), `metrics_summary.csv`,
  `gene_panel.json` and `analysis_summary.html` are copied unchanged, so they
  still describe the full dataset. The `*.tar.gz` archives are dropped.

authors:
  - __merge__: /src/authors/mirte_detemmerman.yaml
    roles: [ author ]

arguments:
  - name: "--input"
    alternatives: ["-i"]
    type: file
    description: |
      Input folder. Must contain the raw output from a Xenium run (the same
      bundle read by `convert/from_xenium_to_spatialdata`).
    example: xenium_data
    direction: input
    required: true
  - name: "--output"
    alternatives: ["-o"]
    type: file
    description: The directory where the cropped Xenium output bundle will be stored.
    example: "xenium_data_tiny"
    direction: output
    required: true
  - name: "--margin_um"
    type: double
    default: 10.0
    description: Padding, in microns, around the selected patch's cell bounding box.
  - name: "--eps_um"
    type: double
    default: 30.0
    description: |
      Single-linkage radius, in microns, for patch clustering: cells within
      this distance of each other are considered part of the same patch.
  - name: "--min_cells_per_patch"
    type: integer
    default: 5
    description: |
      Minimum number of cells to form a patch. Smaller clusters and isolated
      cells are excluded.
  - name: "--patch_rank"
    type: integer
    default: 0
    description: |
      Which patch to keep, ranked by cell count descending (0 = largest).

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium_multichannel/xenium_multicellseg_tiny/

engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        packages:
          - pandas~=2.2.3
          - numpy~=2.1.3
          - pyarrow~=18.0.0
          - scipy~=1.17.1
          - h5py~=3.12.1
          - tifffile~=2024.12.12
          # backend tifffile needs to decode the morphology_focus OME-TIFF
          # channels, which are JPEG2000-compressed
          - imagecodecs~=2024.12.30
          - zarr~=3.0.6
    __merge__: [ /src/base/requirements/python_test_setup.yaml, . ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowmem, singlecpu]
