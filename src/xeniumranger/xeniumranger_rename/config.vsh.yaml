name: xeniumranger_rename
namespace: xeniumranger
scope: public
description: |
  The rename pipeline allows you to change the sample region_name and cassette_name throughout all the Xenium Onboard Analysis 
  output files that contain this information using Xenium Ranger 4.0. 
keywords: [xeniumranger]
links:
  documentation: https://www.10xgenomics.com/support/software/xenium-ranger/latest/analysis/running-pipelines/rename
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
- name: Inputs
  arguments:
  - name: "--xenium_bundle"
    type: file
    required: true
    description: |
      File path to directory containing all required Xenium Onboard Analysis output files.
    example: "/path/to/xenium_output_bundle"
  - name: "--region_name"
    required: false
    type: string
    description: |
      New region name. Limit of 64 characters, upper or lowercase letters, numbers, underscores, and hyphens.
  - name: "--cassette_name"
    required: false
    type: string
    description: |
      New cassette name. Limit of 32 characters, upper or lowercase letters, numbers, underscores, and hyphens.
- name: Outputs
  arguments:
  - name: "--output"
    type: file
    required: true
    direction: output
    description: |
      The folder to store the renamed Xenium Ranger output bundle.
    example: "/path/to/output"
resources:
  - type: bash_script
    path: script.sh
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium/xenium_tiny
engines:
  - type: docker
    image: quay.io/nf-core/xeniumranger:4.0
    setup:
      - type: docker
        run: |
          DEBIAN_FRONTEND=noninteractive apt update && \
          apt upgrade -y && apt install -y procps && rm -rf /var/lib/apt/lists/*
    __merge__: [ /src/base/requirements/xeniumranger_test_setup.yaml, .]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowcpu, lowmem, lowdisk]
