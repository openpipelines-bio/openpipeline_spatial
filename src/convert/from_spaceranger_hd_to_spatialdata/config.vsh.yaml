name: "from_spaceranger_hd_to_spatialdata"
namespace: "convert"
scope: "public"
description: |
  Converts the output from 10X Genomics Space Ranger for Visium HD into a
  SpatialData object.

  By default it reads the segmented cells (per-cell count matrix and cell
  boundary polygons) that Space Ranger 4.x writes to `segmented_outputs/`. Set
  `--mode bins` to instead read one or more binned outputs
  (`binned_outputs/square_<N>um/`) at the bin sizes given by `--bin_size`. In
  `--mode bins` the cell segmentation is not included in the output. See
  `--output_table` for how the output tables are named.
keywords: [spaceranger, visium_hd, segmentation, spatialdata]
links:
  documentation: https://www.10xgenomics.com/support/software/space-ranger/latest/analysis/outputs/segmented-outputs
authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]
arguments:
  - name: "--input"
    alternatives: ["-i"]
    type: file
    description: |
      Input folder containing the output from a Space Ranger run for Visium HD
      and a `*_feature_slice.h5` file. Must contain a `segmented_outputs/`
      directory for `--mode segmented_cells`, or `binned_outputs/` for
      `--mode bins`.
    example: spaceranger_output
    direction: input
    required: true
  - name: "--output"
    alternatives: ["-o"]
    type: file
    description: Zarr directory where the SpatialData object will be stored.
    example: "visium_hd_data.zarr"
    direction: output
    required: true
  - name: "--output_table"
    type: string
    multiple: true
    required: false
    description: |
      Names of the tables in the output SpatialData object. If given, there
      must be one name for each loaded table. For `--mode bins`, this muse be in
      the same order as `--bin_size`. For `--mode segmented_cells`, the first
      name is for the cell table and the second name is used for the nucleus
      table if `--load_nucleus_segmentations` is set.

      If not given, the cell table or a single bin table is named `table`.
      Several bin tables and the nucleus table keep the `spatialdata-io` names
      (e.g. `square_008um`, `nucleus_segmentations`).
    example: [ table ]
  - name: "--mode"
    type: string
    description: |
      Which output to load into the table: `segmented_cells` (per-cell counts
      and cell boundary polygons from `segmented_outputs/`) or `bins` (binned
      counts from `binned_outputs/square_<bin_size>um/`).
    choices: [ segmented_cells, bins ]
    default: segmented_cells
  - name: "--bin_size"
    type: integer
    description: |
      Bin sizes in microns to load when `--mode bins`. Visium HD captures data
      at 2 µm and aggregates it into 8 µm and 16 µm square bins by default, set
      [2, 8, 16] to read all of these. Space Ranger can also write a custom bin
      size. Each bin size must be present in `binned_outputs/`.
    multiple: true
    default: [ 8 ]
  - name: "--load_nucleus_segmentations"
    type: boolean
    default: false
    description: |
      Also load the nucleus segmentation for `--mode segmented_cells`. Added as
      an extra table with nucleus polygon shapes, see `--output_table` for
      naming. Its counts are the sum of the 2 µm bins under each nucleus. Needs
      `segmented_outputs/nucleus_segmentations.geojson`, a
      `barcode_mappings.parquet` file and the filtered 2 µm bin matrix in the
      `--input` directory.
  - name: "--output_type"
    type: string
    description: |
      Which binned count matrix to load when `--mode bins`. Either `filtered`
      (barcodes under tissue only) or `raw` (all barcodes). Not used for
      `--mode segmented_cells`, which always loads the filtered cell matrix.
    choices: [ filtered, raw ]
    default: filtered
  - name: "--output_layer"
    type: string
    description: |
      If provided, the count matrix of each output table is also stored as a
      named layer (`table.layers[output_layer]`) in addition to `.X`.
    required: false
  - name: "--dataset_id"
    type: string
    description: |
      Identifier used to name the spatial elements (shapes and images) in the
      SpatialData object. If not provided, it is inferred from the
      `*_feature_slice.h5` file name in the input directory.
    required: false
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/visium_hd
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        __merge__: [ /src/base/requirements/spatialdata-io.yaml, . ]
    __merge__: [ /src/base/requirements/python_test_setup.yaml, . ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ midmem, singlecpu ]
