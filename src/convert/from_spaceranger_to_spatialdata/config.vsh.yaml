name: "from_spaceranger_to_spatialdata"
namespace: "convert"
scope: "public"
description: |
  Converts the output from 10X Genomics Space Ranger for Visium into a
  SpatialData object.

  The spot count matrix is loaded into a table, together with the spot
  positions (shapes) and the high and low resolution tissue images. The table
  is renamed to the value of `--output_table`.
keywords: [spaceranger, visium, spatialdata]
links:
  documentation: https://www.10xgenomics.com/support/software/space-ranger/latest/analysis/outputs/output-overview
authors:
  - __merge__: /src/authors/luke_zappia.yaml
    roles: [ author ]
arguments:
  - name: "--input"
    alternatives: ["-i"]
    type: file
    description: |
      Input folder containing the output from a Space Ranger run for Visium.
      Must contain the count matrices (`filtered_feature_bc_matrix.h5` and/or
      `raw_feature_bc_matrix.h5`) and a `spatial/` directory.
    example: spaceranger_output
    direction: input
    required: true
  - name: "--output"
    alternatives: ["-o"]
    type: file
    description: Zarr directory where the SpatialData object will be stored.
    example: "visium_data.zarr"
    direction: output
    required: true
  - name: "--output_table"
    type: string
    default: table
    description: Name of the main table in the output SpatialData object.
  - name: "--output_type"
    type: string
    description: |
      Which count matrix to load: `filtered` (barcodes under tissue only) or
      `raw` (all barcodes).
    choices: [ filtered, raw ]
    default: filtered
  - name: "--output_layer"
    type: string
    description: |
      If provided, the count matrix is also stored as a named layer
      (`table.layers[output_layer]`) in addition to `.X`.
    required: false
  - name: "--dataset_id"
    type: string
    description: |
      Identifier used to name the spatial elements (shapes and images) in the
      SpatialData object. If not provided, the name of the input directory is
      used.
    required: false
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/visium/Visium_FFPE_Human_Ovarian_Cancer_tiny_spaceranger
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        __merge__: [ /src/base/requirements/spatialdata-io.yaml, . ]
    __merge__: [ /src/base/requirements/python_test_setup.yaml, . ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ lowmem, singlecpu ]
