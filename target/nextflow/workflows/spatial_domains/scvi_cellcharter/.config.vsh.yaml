name: "scvi_cellcharter"
namespace: "workflows/spatial_domains"
version: "build_main"
authors:
- name: "Mirte De Temmerman"
  roles:
  - "author"
  - "maintainer"
  info:
    links:
      github: "mimi-DT"
      linkedin: "mirtedt"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "string"
    name: "--id"
    description: "ID of the sample."
    info: null
    example:
    - "foo"
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "Path to the processed H5MU file."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--layer"
    description: "Layer containing the raw counts to train the scVI model on. If not\
      \ set, `.X` is used."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_obsm_spatial_coords"
    description: "Key in `.obsm` where the spatial coordinates are stored. These must\
      \ be global coordinates within\neach batch. For CosMx data, use `spatial_fov`,\
      \ since `spatial` holds coordinates relative to each FOV.\n"
    info: null
    default:
    - "spatial"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_obs_batch_key"
    description: "Key in `.obs` that identifies the batch (e.g. sample) each observation\
      \ belongs to.\nThe spatial neighborhood graph and the neighborhood aggregation\
      \ are computed separately for\neach batch, so no neighbors are shared between\
      \ observations of different batches.\n"
    info: null
    default:
    - "sample_id"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "scVI"
  description: "Options for the dimensionality reduction with scVI."
  arguments:
  - type: "string"
    name: "--obs_batch"
    description: "Key in `.obs` identifying the batches to correct for with scVI."
    info: null
    default:
    - "sample_id"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--var_input"
    description: "Key of a boolean column in `.var` selecting the genes to train the\
      \ scVI model on\n(e.g. highly variable genes). If not set, all genes are used.\n"
    info: null
    example:
    - "filter_with_hvg"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_dimensions_latent_space"
    description: "Dimensionality of the scVI latent space. The number of features\
      \ to cluster scales with this value\nand the number of aggregated neighborhood\
      \ layers, so CellCharter recommends a low value.\n"
    info: null
    default:
    - 10
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--scvi_max_epochs"
    description: "Number of passes through the dataset to train the scVI model.\n\
      Defaults to (20000 / number of cells) * 400 or 400, whichever is smallest.\n"
    info: null
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--early_stopping"
    description: "Whether to perform early stopping with respect to the validation\
      \ set when training the scVI model."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obsm_scvi"
    description: "Key in `.obsm` where the scVI embedding will be stored."
    info: null
    default:
    - "X_scvi"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Spatial Neighbor Graph"
  description: "Options for the calculation of the spatial neighborhood graph."
  arguments:
  - type: "string"
    name: "--coord_type"
    description: "Type of coordinate system. Valid options are:\n`grid` - grid coordinates.\
      \ Only relevant for lattice-based layouts (e.g. Visium).\n`generic` - generic\
      \ coordinates. Recommended for imaging-based data (e.g. Xenium, CosMx).\n"
    info: null
    default:
    - "generic"
    required: false
    choices:
    - "generic"
    - "grid"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_spatial_neighbors"
    description: "Depending on `--coord_type`:\n`grid` - number of neighboring tiles.\n\
      `generic` - number of neighbors. Only used when `--delaunay false`.\n"
    info: null
    default:
    - 6
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--delaunay"
    description: "Whether to use Delaunay triangulation to determine the spatial neighborhood\
      \ graph,\nas recommended by CellCharter. Only used when `--coord_type generic`.\n"
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--percentile"
    description: "Prune edges that are longer than this percentile of all edge distances\
      \ within a batch,\nto remove the long links created by Delaunay triangulation.\
      \ Only used when `--coord_type generic`.\n"
    info: null
    default:
    - 99.0
    required: false
    min: 0.0
    max: 100.0
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Neighborhood Aggregation"
  description: "Options for the aggregation of the scVI embedding over the spatial\
    \ neighborhood of every cell."
  arguments:
  - type: "integer"
    name: "--n_layers"
    description: "Which neighborhood layers (hops) to aggregate.\nIf a single value\
      \ `n` is provided, the cells' own features and the aggregated features of the\n\
      neighbors up to `n` hops away are concatenated: `cell | 1-hop | ... | n-hop`.\n\
      If multiple values are provided, each value is a hop distance to aggregate,\
      \ and `0` (the cells'\nown features) must be included, e.g. `0;1;3`.\n"
    info: null
    default:
    - 3
    required: false
    min: 0
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--aggregations"
    description: "Which functions to use to aggregate the neighbors' features."
    info: null
    default:
    - "mean"
    required: false
    choices:
    - "mean"
    - "var"
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--obsm_cellcharter"
    description: "Key in `.obsm` where the aggregated neighborhood features will be\
      \ stored."
    info: null
    default:
    - "X_cellcharter"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Clustering"
  description: "Options for the clustering into spatial domains. Provide `--n_clusters`,\
    \ `--n_clusters_range`, or both.\n"
  arguments:
  - type: "integer"
    name: "--n_clusters"
    description: "Number of clusters.\nWhen `--n_clusters_range` is not set, a single\
      \ model is fitted with this number of clusters.\nWhen `--n_clusters_range` is\
      \ set, the stability analysis is still performed, but the cells are\nclustered\
      \ with this number of clusters instead of the most stable one. Must be within\
      \ `--n_clusters_range`.\n"
    info: null
    example:
    - 6
    required: false
    min: 2
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_clusters_range"
    description: "Minimum and maximum number of clusters (both included) to evaluate\
      \ in the stability analysis\nfor the automatic selection of the number of clusters.\n"
    info: null
    example:
    - 2
    - 10
    required: false
    min: 2
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "integer"
    name: "--max_runs"
    description: "Maximum number of repetitions of the clustering for every number\
      \ of clusters in `--n_clusters_range`.\n"
    info: null
    default:
    - 10
    required: false
    min: 2
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--stability_convergence_tolerance"
    description: "If the mean absolute percentage error of the stability between consecutive\
      \ runs is below this\nvalue, no more runs are performed.\n"
    info: null
    default:
    - 0.01
    required: false
    min: 0.0
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--covariance_type"
    description: "The type of covariance to assume for all Gaussian components."
    info: null
    default:
    - "full"
    required: false
    choices:
    - "full"
    - "tied"
    - "diag"
    - "spherical"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--cluster_max_epochs"
    description: "Maximum number of epochs (EM iterations) to fit the Gaussian Mixture\
      \ Model."
    info: null
    default:
    - 100
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--cluster_batch_size"
    description: "Batch size used to fit the Gaussian Mixture Model. If not set, all\
      \ cells are used as a single batch.\n"
    info: null
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--accelerator"
    description: "Hardware to fit the Gaussian Mixture Model on. `auto` uses a GPU\
      \ when one is available.\n"
    info: null
    default:
    - "auto"
    required: false
    choices:
    - "auto"
    - "cpu"
    - "gpu"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--cluster_random_state"
    description: "Random seed for the clustering."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obs_cluster"
    description: "Key in `.obs` where the spatial domain labels will be stored."
    info: null
    default:
    - "cellcharter_cluster"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--uns_stability"
    description: "Key in `.uns` where the results of the stability analysis will be\
      \ stored, when `--n_clusters_range` is set.\n"
    info: null
    default:
    - "cellcharter_autok"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    description: "Destination path to the output."
    info: null
    example:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_scvi_model"
    description: "Folder where the trained scVI model will be saved to."
    info: null
    example:
    - "scvi_model"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata objects.\n\
      By default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "A pipeline to identify spatial domains with CellCharter, performing\
  \ the following steps:\n\n1. `integrate/scvi`: reduce the dimensionality of the\
  \ gene expression with scVI, correcting for batch effects.\n2. `neighbors/spatial_neighborhood_graph`:\
  \ build a spatial neighborhood graph per batch, and prune long links.\n3. `cellcharter/aggregate_neighbors`:\
  \ aggregate the scVI embedding of every cell's spatial neighborhood over multiple\
  \ hops.\n4. `cellcharter/cluster`: cluster the aggregated features into spatial\
  \ domains with a Gaussian Mixture Model,\n   either with a fixed number of clusters\
  \ (`--n_clusters`), or by selecting the number of clusters\n   with a stability\
  \ analysis (`--n_clusters_range`). At least one of both must be provided.\n\nThe\
  \ input is an already processed and filtered (multi-sample) H5MU file, e.g. the\
  \ output of\n`workflows/multiomics/spatial_process_samples`. \n\nNote: spatial domains\
  \ are currently computed from a single gene expression modality, modelled wiht scVI.\n\
  Joint modelling of RNA and protein (e.g. with totalVI for CITE-seq-like data) is\
  \ not yet supported.\n"
test_resources:
- type: "nextflow_script"
  path: "test.nf"
  is_executable: true
  entrypoint: "test_wf"
- type: "file"
  path: "Lung5_tiny_processed.h5mu"
- type: "file"
  path: "visium_tiny_processed.h5mu"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
dependencies:
- name: "integrate/scvi"
  repository:
    type: "vsh"
    repo: "openpipeline"
    tag: "v4.1.0"
- name: "neighbors/spatial_neighborhood_graph"
  repository:
    type: "local"
- name: "cellcharter/aggregate_neighbors"
  repository:
    type: "local"
- name: "cellcharter/cluster"
  repository:
    type: "local"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_spatial"
  docker_registry: "ghcr.io"
runners:
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
