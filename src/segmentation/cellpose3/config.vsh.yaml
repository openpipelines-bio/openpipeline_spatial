name: cellpose3
scope: "public"
namespace: segmentation
description: |
  Segment cells or nuclei from a spatial image using Cellpose3.

  Reads an image element from a SpatialData Zarr store and runs one of
  Cellpose's generalist segmentation models (or a custom pretrained model) on
  it, producing an instance segmentation mask. The resulting mask is written
  back into the SpatialData object as a new labels element, aligned to the
  input image's coordinate transformations.

references:
  doi:
    - "10.1038/s41592-020-01018-x" # Cellpose: a generalist algorithm for cellular segmentation
    - "10.1038/s41592-025-02595-5" # Cellpose3: one-click image restoration for improved segmentation

authors:
  - __merge__: /src/authors/mirte_detemmerman.yaml
    roles: [ author ]

argument_groups:
  - name: "Inputs"
    arguments:
      - name: "--input"
        type: file
        required: true
        description: Input SpatialData Zarr store containing the image to segment.
        example: input.zarr
      - name: "--input_image"
        type: string
        default: "morphology_focus"
        description: |
          Key in `sdata.images` of the image element to segment.
      - name: "--cytoplasm_channel"
        type: integer
        default: 0
        min: 0
        description: |
          Channel to use for cytoplasm/cell-body segmentation, using Cellpose's
          1-based channel numbering: 1 is the first channel along the image's
          channel axis, 2 the second, and so on. A value of 0 does not select a
          channel, it averages all channels into a single grayscale image.
          Note this is deliberately offset by one from numpy-style indexing, so
          the first channel of a Xenium `morphology_focus` image (DAPI) is 1,
          not 0.
      - name: "--nuclear_channel"
        type: integer
        default: 0
        min: 0
        description: |
          Optional nuclear channel, using the same 1-based numbering as
          `--cytoplasm_channel`. A value of 0 means no separate nuclear channel
          is used. Only meaningful for models trained on two channels (e.g.
          `cyto3`); the `nuclei` model ignores it.

  - name: "Parameters"
    arguments:
      - name: "--model_type"
        type: string
        default: "nuclei"
        description: |
          Built-in Cellpose model to use, e.g. `nuclei` (nucleus model),
          `cyto3` (generalist cell model, requires a cytoplasm/membrane
          channel) or `cyto2`. Ignored if `--pretrained_model` is set.
        choices: [ "cyto3", "nuclei", "cyto2_cp3", "tissuenet_cp3", "livecell_cp3", "yeast_PhC_cp3",
                  "yeast_BF_cp3", "bact_phase_cp3", "bact_fluor_cp3", "deepbacs_cp3", "cyto2", "cyto", "CPx",
                  "transformer_cp3", "neurips_cellpose_default", "neurips_cellpose_transformer",
                  "neurips_grayscale_cyto2",
                  "CP", "CPx", "TN1", "TN2", "TN3", "LC1", "LC2", "LC3", "LC4"]
      - name: "--pretrained_model"
        type: file
        required: false
        description: |
          Path to a custom pretrained Cellpose model. If provided, this is
          used instead of `--model_type`.
      - name: "--diameter"
        type: double
        required: false
        min: 0.0
        description: |
          Expected diameter of objects in pixels. If not provided, Cellpose
          uses the diameter of the objects in the model's training labels,
          not a value measured from the input image.
      - name: "--flow_threshold"
        type: double
        default: 0.4
        description: |
          Maximum allowed error of the flows for each mask. Increase this
          threshold if Cellpose is not returning enough masks; decrease it if
          Cellpose is returning too many ill-shaped masks.
      - name: "--cellprob_threshold"
        type: double
        default: 0.0
        min: -6.0
        max: 6.0
        description: |
          Pixels with cell probability above this threshold are used to run
          dynamics and determine masks. Decrease this threshold if Cellpose is
          not returning as many masks as expected.
      - name: "--min_size"
        type: integer
        default: 15
        min: 1
        description: Minimum number of pixels per mask; masks smaller than this are discarded.
      - name: "--niter"
        type: integer
        required: false
        min: 0
        description: |
          Number of iterations of the dynamics simulation used to derive
          masks. If not provided, this is determined automatically based on
          the object diameter.
      - name: "--resample"
        type: boolean
        default: true
        description: |
          Whether to run dynamics on the full-resolution image rather than on
          the (typically smaller) resized image used internally by the model.
      - name: "--augment"
        type: boolean
        default: false
        description: Whether to tile the image with overlapping tiles and average the predictions.
      - name: "--batch_size"
        type: integer
        default: 8
        min: 1
        description: Number of image tiles/patches to run simultaneously on the GPU or CPU.
      - name: "--use_gpu"
        type: boolean
        default: false
        description: Whether to run the model on a GPU, if one is available.
      - name: "--normalize_percentile_low"
        type: double
        default: 1.0
        min: 0.0
        max: 100.0
        description: |
          Lower percentile used to rescale pixel intensities before running
          the model.
      - name: "--normalize_percentile_high"
        type: double
        default: 99.9
        min: 0.0
        max: 100.0
        description: |
          Upper percentile used to rescale pixel intensities before running
          the model. Fluorescence images such as spatial transcriptomics DAPI
          scans are mostly background, so Cellpose's own default of 99 can
          land on a still-zero pixel and degenerate the normalization; 99.9
          is a safer default for this kind of sparse image.

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        direction: output
        required: true
        description: Output SpatialData Zarr store.
        example: output.zarr
      - name: "--output_labels"
        type: string
        default: "cellpose_labels"
        description: |
          Key under which to store the resulting segmentation mask in
          `sdata.labels`.

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium/xenium_tiny.zarr

engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: docker
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cu124
      - type: python
        __merge__: [ /src/base/requirements/spatialdata.yaml, . ]
      - type: python
        packages:
          - cellpose~=3.1.0
    __merge__: [ /src/base/requirements/python_test_setup.yaml, .]

runners:
  - type: executable
    # docker_run_args: ["--gpus all"]
  - type: nextflow
    directives:
      label: [midcpu, midmem, middisk, gpu]
