name: xeniumranger_import_segmentation
namespace: xeniumranger
scope: public
description: |
  Specify 2D nuclei and/or cell segmentation results to use for assigning transcripts to cells and recalculate all Xenium Onboard Analysis (XOA) outputs that depend on segmentation. 
keywords: [xeniumranger]
links:
  documentation: https://www.10xgenomics.com/support/software/xenium-ranger/latest/analysis/running-pipelines/XR-import-segmentation
authors:
  - __merge__: /src/authors/hannes_demeyer.yaml
    roles: [ author ]
argument_groups:
- name: Inputs
  arguments:
  - name: "--xenium_bundle"
    type: file
    required: true
    description: |
      File path to directory containing all required Xenium Onboard Analysis output files.
    example: "/path/to/xenium_output_bundle"
- name: General arguments
  arguments:
  - name: "--units"
    type: string
    required: false
    description: |
      Indicates whether segmentation results are in physical space ("microns") or pixel space ("pixels"). Must be set as "microns" if --coordinate_transform or --transcript_assignment is used.
    choices: ["microns", "pixels"]
    default: "pixels"
- name: Image based segmentation arguments 
  arguments:
  - name: "--expansion_distance"
    type: double
    required: false
    description: |
      Nuclei boundary expansion distance in micrometers. Only for use when nucleus segmentation provided as input.
      If not set, Xenium Ranger uses its default of 5 micrometers when --nuclei is provided.
    min: 0
    max: 100
    example: 5
  - name: "--nuclei"
    type: file
    required: false
    description: |
      Label mask (TIFF or NPY), polygons of nucleus segmentations (GeoJSON FeatureCollection), or Xenium Onboard Analysis cells.zarr.zip (the nucleus masks as input). --nuclei will use nucleusGeometry polygon if it exists in the GeoJSON (i.e., for QuPath-like GeoJSON files), or geometry if it does not. Error if --transcript_assignment argument is used.
    example: "/path/to/cells.zarr"
  - name: "--cells"
    type: file
    required: false
    description: |
      Label mask (TIFF or NPY), polygons of cell segmentations (GeoJSON FeatureCollection), or Xenium Onboard Analysis cells.zarr.zip (the cell masks as input). Features with a non-cell objectType will be ignored. Must be used together with --nuclei. Error if --transcript_assignment argument is used.
    example: '/path/to/cells.zarr.zip'
  - name: "--coordinate_transform"
    type: file
    required: false
    description: |
      Image alignment file containing similarity transform matrix. Works with segmentation results in polygon or label mask format
    example: "/path/to/_imagealignment.csv"
- name: Transcript based segmentation arguments
  arguments:
  - name: "--viz_polygons"
    type: file
    required: false
    description: |
      Cell boundary polygons (GeoJSON) from 3rd party segmentation tools. Provided as input to Xenium Ranger so visualization polygons are included in output bundle to view in Xenium Explorer and 3rd party plotting tools. Required if --transcript_assignment argument used. Error if --cells or --nuclei arguments used.
    example: "/path/to/segmentation_polygons_2d.json"
  - name: "--transcript_assignment"
    type: file
    required: false
    description: |
      Transcript CSV with cell assignment from 3rd party segmentation tools. Error if --cells or --nuclei arguments are used.
    example: "/path/to/segmentation.csv"
- name: Outputs
  arguments:
  - name: "--output"
    type: file
    required: true
    direction: output
    description: |
      The folder to store the Xenium Ranger output bundle with the imported segmentation applied.
    example: "/path/to/output"
resources:
  - type: bash_script
    path: script.sh
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium_multichannel/xenium_multicellseg_tiny_cropped
  - path: /resources_test/xenium_multichannel/xenium_multicellseg_tiny_cropped_transcript_assignment
engines:
  - type: docker
    image: quay.io/nf-core/xeniumranger:4.0
    setup:
      - type: docker
        run: |
          DEBIAN_FRONTEND=noninteractive apt update && \
          apt upgrade -y && apt install -y procps && rm -rf /var/lib/apt/lists/*
    __merge__: [ /src/base/requirements/xeniumranger_test_setup.yaml, .]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [highcpu, veryhighmem, highdisk]