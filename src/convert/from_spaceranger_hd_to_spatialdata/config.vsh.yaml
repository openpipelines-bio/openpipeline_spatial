name: "from_spaceranger_hd_to_spatialdata"
namespace: "convert"
scope: "public"
description: |
  Converts the output from 10X Genomics Space Ranger for Visium HD into a
  SpatialData object.

  By default it reads the segmented cells (per-cell count matrix and cell
  boundary polygons) that Space Ranger 4.x writes to `segmented_outputs/`. Set
  `--mode bins` to instead read a binned output (`binned_outputs/square_<N>um/`)
  at the bin size given by `--bin_size`. In both cases the loaded table is
  renamed to "table" so that downstream components stay technology-agnostic.
keywords: [spaceranger, visium_hd, segmentation, spatialdata]
links:
  documentation: https://www.10xgenomics.com/support/software/space-ranger/latest/analysis/outputs/segmented-outputs
authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]
arguments:
  - name: "--input"
    alternatives: ["-i"]
    type: file
    description: |
      Input folder containing the output from a Space Ranger run for Visium HD
      and a `*_feature_slice.h5` file. Must contain a `segmented_outputs/`
      directory for `--mode segmented_cells`, or `binned_outputs/` for
      `--mode bins`.
    example: spaceranger_output
    direction: input
    required: true
  - name: "--output"
    alternatives: ["-o"]
    type: file
    description: Zarr directory where the SpatialData object will be stored.
    example: "visium_hd_data.zarr"
    direction: output
    required: true
  - name: "--mode"
    type: string
    description: |
      Which output to load into the table: `segmented_cells` (per-cell counts
      and cell boundary polygons from `segmented_outputs/`) or `bins` (binned
      counts from `binned_outputs/square_<bin_size>um/`).
    choices: [ segmented_cells, bins ]
    default: segmented_cells
  - name: "--bin_size"
    type: integer
    description: |
      Bin size in microns to load when `--mode bins`. Visium HD captures data at
      2 µm and aggregates it into 8 µm and 16 µm square bins.
    choices: [ 2, 8, 16 ]
    default: 8
  - name: "--output_type"
    type: string
    description: |
      Which count matrix to load: `filtered` (barcodes under tissue only) or
      `raw` (all barcodes). Applies to both the segmented-cell and binned matrices.
    choices: [ filtered, raw ]
    default: filtered
  - name: "--output_layer"
    type: string
    description: |
      If provided, the count matrix is also stored as a named layer
      (`table.layers[output_layer]`) in addition to `.X`.
    required: false
  - name: "--dataset_id"
    type: string
    description: |
      Identifier used to name the spatial elements (shapes and images) in the
      SpatialData object. If not provided, it is inferred from the
      `*_feature_slice.h5` file name in the input directory.
    required: false
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/visium_hd
engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        __merge__: [ /src/base/requirements/spatialdata-io.yaml, . ]
    __merge__: [ /src/base/requirements/python_test_setup.yaml, . ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ midmem, singlecpu ]
