name: "subset_xenium"
scope: "private"
namespace: "filter"
description: |
  Crops a raw 10x Genomics Xenium output bundle down to one dense patch of cells.

  This operates directly on the *raw* `outs/` bundle (the same format read by
  `convert/from_xenium_to_spatialdata`/`convert/from_xenium_to_h5mu`), producing a
  smaller bundle in the same native format, rather than converting first and
  cropping the converted representation. The output is a complete bundle, valid
  as input for both the converters and Xenium Ranger (e.g. `import-segmentation`,
  `resegment`). The following files are read, cropped (consistently, to the same
  patch) and written back in place:

    - `cells.zarr.zip`: the cell and nucleus label rasters (`masks/1`,
      `masks/0`), metadata table and polygon sets. Only cells lying entirely
      inside the crop window, with all of their nuclei, are kept (the canonical
      "kept cells" set for every other file). Both rasters are renumbered to a
      contiguous 1..N range matching the row order of the cropped tables (label
      `L` -> row `L-1`), and the polygon sets are subset to the same
      cells/nuclei, since `spatialdata_io` and Xenium Ranger cross-check them.
    - `cells.parquet`, `cell_boundaries.parquet`, `nucleus_boundaries.parquet`:
      filtered to the kept cells.
    - `transcripts.parquet`: filtered to the crop window; transcripts assigned
      to a dropped cell become `UNASSIGNED`.
    - `cell_feature_matrix.h5`: the CellRanger-format HDF5 matrix, resliced to
      the kept cell barcodes.
    - `transcripts.zarr.zip`, `cell_feature_matrix.zarr.zip`,
      `analysis.zarr.zip`: the Xenium Explorer companions (required by Xenium
      Ranger), rebuilt from the kept transcripts and cells, when present.
    - `morphology_focus/*.ome.tif`, `morphology.ome.tif`: every plane cropped to
      the same pixel region, keeping the tiled, pyramidal layout. Each file's
      OME-XML is reused as-is (channel names, IDs) with only `SizeX`/`SizeY`
      patched, since the reader depends on it for multi-channel datasets.
    - `*.csv.gz`: legacy duplicates of the parquet tables, rewritten from the
      cropped tables when present in the source.

  All zarr stores are written in zarr v2 format, the only one Xenium Ranger
  reads. `experiment.xenium` is copied with `num_cells` updated;
  `metrics_summary.csv`, `gene_panel.json` and `analysis_summary.html` are copied
  through unchanged. The `*.tar.gz` archives are dropped from the output bundle.

  Cell centroids (`cells.parquet`'s `x_centroid`/`y_centroid`, in microns) are
  clustered by distance to find spatially separated patches, useful for source
  datasets that were themselves "artificially subset to N square patches" within
  one larger image, so a plain bounding box over all cells would span the
  (mostly empty) gaps between patches instead of just one dense region. One
  patch is then picked (ranked by cell count) and its micron bounding box, with
  a margin, is used to crop the bundle.

authors:
  - __merge__: /src/authors/mirte_detemmerman.yaml
    roles: [ author ]

arguments:
  - name: "--input"
    alternatives: ["-i"]
    type: file
    description: |
      Input folder. Must contain the raw output from a Xenium run (the same
      bundle read by `convert/from_xenium_to_spatialdata`).
    example: xenium_data
    direction: input
    required: true
  - name: "--output"
    alternatives: ["-o"]
    type: file
    description: The directory where the cropped Xenium output bundle will be stored.
    example: "xenium_data_tiny"
    direction: output
    required: true
  - name: "--margin_um"
    type: double
    default: 10.0
    description: Padding, in microns, around the selected patch's cell bounding box.
  - name: "--eps_um"
    type: double
    default: 30.0
    description: |
      Single-linkage radius, in microns, for patch clustering: cells within
      this distance of each other are considered part of the same patch.
  - name: "--min_cells_per_patch"
    type: integer
    default: 5
    description: |
      Minimum number of cells to form a patch. Smaller clusters and isolated
      cells are excluded.
  - name: "--patch_rank"
    type: integer
    default: 0
    description: |
      Which patch to keep, ranked by cell count descending (0 = largest).

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/xenium/xenium_multicellseg_tiny/

engines:
  - type: docker
    image: python:3.12-slim
    setup:
      - type: apt
        packages:
          - procps
      - type: python
        packages:
          - pandas~=2.2.3
          - numpy~=2.1.3
          - pyarrow~=18.0.0
          - scipy~=1.17.1
          - h5py~=3.12.1
          - tifffile~=2024.12.12
          # backend tifffile needs to decode the morphology_focus OME-TIFF
          # channels, which are JPEG2000-compressed
          - imagecodecs~=2024.12.30
          - zarr~=3.0.6
    __merge__: [ /src/base/requirements/python_test_setup.yaml, . ]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [lowmem, singlecpu]
