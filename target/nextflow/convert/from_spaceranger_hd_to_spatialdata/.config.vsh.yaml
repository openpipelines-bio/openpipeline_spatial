name: "from_spaceranger_hd_to_spatialdata"
namespace: "convert"
version: "build_main"
authors:
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    links:
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "Input folder containing the output from a Space Ranger run for Visium\
      \ HD\nand a `*_feature_slice.h5` file. Must contain a `segmented_outputs/`\n\
      directory for `--mode segmented_cells`, or `binned_outputs/` for\n`--mode bins`.\n"
    info: null
    example:
    - "spaceranger_output"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    alternatives:
    - "-o"
    description: "Zarr directory where the SpatialData object will be stored."
    info: null
    example:
    - "visium_hd_data.zarr"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--mode"
    description: "Which output to load into the table: `segmented_cells` (per-cell\
      \ counts\nand cell boundary polygons from `segmented_outputs/`) or `bins` (binned\n\
      counts from `binned_outputs/square_<bin_size>um/`).\n"
    info: null
    default:
    - "segmented_cells"
    required: false
    choices:
    - "segmented_cells"
    - "bins"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--bin_size"
    description: "Bin size in microns to load when `--mode bins`. Visium HD captures\
      \ data at\n2 µm and aggregates it into 8 µm and 16 µm square bins.\n"
    info: null
    default:
    - 8
    required: false
    choices:
    - 2
    - 8
    - 16
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_type"
    description: "Which count matrix to load: `filtered` (barcodes under tissue only)\
      \ or\n`raw` (all barcodes). Applies to both the segmented-cell and binned matrices.\n"
    info: null
    default:
    - "filtered"
    required: false
    choices:
    - "filtered"
    - "raw"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_layer"
    description: "If provided, the count matrix is also stored as a named layer\n\
      (`table.layers[output_layer]`) in addition to `.X`.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--dataset_id"
    description: "Identifier used to name the spatial elements (shapes and images)\
      \ in the\nSpatialData object. If not provided, it is inferred from the\n`*_feature_slice.h5`\
      \ file name in the input directory.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "setup_logger.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Converts the output from 10X Genomics Space Ranger for Visium HD into\
  \ a\nSpatialData object.\n\nBy default it reads the segmented cells (per-cell count\
  \ matrix and cell\nboundary polygons) that Space Ranger 4.x writes to `segmented_outputs/`.\
  \ Set\n`--mode bins` to instead read a binned output (`binned_outputs/square_<N>um/`)\n\
  at the bin size given by `--bin_size`. In both cases the loaded table is\nrenamed\
  \ to \"table\" so that downstream components stay technology-agnostic.\n"
test_resources:
- type: "python_script"
  path: "test.py"
  is_executable: true
- type: "file"
  path: "visium_hd"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
keywords:
- "spaceranger"
- "visium_hd"
- "segmentation"
- "spatialdata"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_spatial"
  docker_registry: "ghcr.io"
  documentation: "https://www.10xgenomics.com/support/software/space-ranger/latest/analysis/outputs/segmented-outputs"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "midmem"
    - "singlecpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "python:3.12-slim"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "procps"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "spatialdata-io~=0.5.1"
    - "anndata~=0.12.16"
    - "awkward"
    - "scipy~=1.17.1"
    - "spatialdata~=0.8.0"
    - "pyarrow~=18.0.0"
    - "ome-zarr~=0.18.0"
    upgrade: true
  test_setup:
  - type: "apt"
    packages:
    - "git"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "viashpy==0.10.0"
    github:
    - "openpipelines-bio/core#subdirectory=packages/python/openpipeline_testutils"
    upgrade: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/convert/from_spaceranger_hd_to_spatialdata/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker"
  output: "target/nextflow/convert/from_spaceranger_hd_to_spatialdata"
  executable: "target/nextflow/convert/from_spaceranger_hd_to_spatialdata/main.nf"
  viash_version: "0.9.7"
  git_commit: "a6375482da9158b68a1c1bc093af84b431a3d375"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_spatial"
package_config:
  name: "openpipeline_spatial"
  version: "build_main"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_spatial/resources_test"
      dest: "resources_test"
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'"
  organization: "openpipelines-bio"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline_spatial"
    docker_registry: "ghcr.io"
